name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'claude/couples-conversation-app-io4ft8']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: lock down who may sign in by setting this repo variable
          # (Settings → Secrets and variables → Actions → Variables).
          # If unset, the baked-in allow-list in src/lib/firebase.ts is used.
          VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
